# Leafdeck OS runtime folders (systemd-tmpfiles). /run/leafdeck/failed: the session (os/leafdeck-session) leaves a note
# there when Leafdeck kept crashing, one file per account, and the sign-in screen (electron/greeter.cjs) offers safe mode.
# Sticky and writable by everyone, like /tmp: each account can only replace its own file, and the sign-in screen
# only trusts a file owned by the account it's about.
d /run/leafdeck 0755 root root -
d /run/leafdeck/failed 1777 root root -
