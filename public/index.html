<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Leafdeck</title>
    <link rel="icon" href="/img/leafdeck-icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="/js/theme.js"></script>
    <link rel="stylesheet" href="/css/app.css" />
    <link rel="stylesheet" href="/css/surface.css" />
    <link rel="stylesheet" href="/css/designer.css" />
    <link rel="stylesheet" href="/css/graphic.css" />
    <link rel="stylesheet" href="/css/claudecode.css" />
    <link rel="stylesheet" href="/css/claudesettings.css" />
    <link rel="stylesheet" href="/css/imageeditor.css" />
    <link rel="stylesheet" href="/css/eyedropper.css" />
  </head>
  <body>
    <div id="wallpaper"></div>
    <header id="menubar"></header>
    <main id="desktop">
      <section id="widgets" aria-label="Widgets"></section>
      <section id="icons" aria-label="Desktop"></section>
    </main>
    <div id="windows"></div>
    <div id="search"></div>
    <nav id="dock" aria-label="Dock"></nav>
    <div id="toasts" aria-live="polite"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
