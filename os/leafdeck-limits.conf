# Leafdeck OS: programs may raise a thread's priority as far as nice -10. Chromium gives its display threads nice -8
# when that's allowed; the default limit of 0 refuses it. Applied at sign-in (pam_limits), so a new sign-in is needed
# after installing. Installed by os/setup-fedora.sh to /etc/security/limits.d/30-leafdeck.conf.
*  -  nice  -10
