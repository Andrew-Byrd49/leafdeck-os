# Leafdeck OS: the sign-in session's scope (cage, Leafdeck's GPU process and renderers) outweighs the user manager's
# services (terminals' builds and Claude sessions under leafdeckd.service, the programs Leafdeck opens) when they
# compete for the CPU, so the desktop keeps drawing. Installed by os/setup-fedora.sh to
# /etc/systemd/system/session-.scope.d/; applies to every session-N.scope logind creates.
[Scope]
CPUWeight=1000
IOWeight=500
