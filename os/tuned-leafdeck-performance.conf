# Leafdeck OS "Performance" power mode (tuned-ppd maps performance to this profile; os/setup-fedora.sh). tuned's own
# throughput-performance pins every core at its top P-state (min_perf_pct=100), which on a thin laptop like the Yoga
# Book 9i heats the package past 90 C under load and leaves the GPU at half its clock: fewer frames, not more. This is
# Balanced with the performance bias, boost and platform profile: fast when something asks, cool when nothing does.
[main]
summary=Leafdeck performance: responsive without pinning the top P-state
include=balanced

[cpu]
energy_perf_bias=performance
energy_performance_preference=performance
boost=1

[acpi]
platform_profile=performance
