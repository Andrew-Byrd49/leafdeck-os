# Leafdeck OS: the power button puts the computer to sleep (and wakes it), the way laptops usually work; holding it
# shuts down. logind's default is to shut down on a short press, which GNOME overrides but cage doesn't. GNOME sessions
# are unaffected (GNOME still handles the button itself). Installed by os/setup-fedora.sh to /etc/systemd/logind.conf.d/.
[Login]
HandlePowerKey=suspend
HandlePowerKeyLongPress=poweroff
