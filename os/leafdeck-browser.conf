# Leafdeck OS: terminal tools that open a browser through $BROWSER (gh, pip, Python's webbrowser…) open Leafdeck
# (os/leafdeck-open). systemd hands it to every user service and the programs they start.
BROWSER=leafdeck-open
# And GTK programs ask through the desktop portal, so their Open, Save and Print are Leafdeck's (GTK 3, then GTK 4).
GTK_USE_PORTAL=1
GDK_DEBUG=portals
