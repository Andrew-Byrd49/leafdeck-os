# Leafdeck OS initramfs (built in os/image/Containerfile). No network file systems.
# The boot screen (Plymouth) is in, but draws on the firmware's framebuffer (simpledrm) instead of bringing every
# graphics driver and its firmware into the initramfs (that would add about 140 MB); the real driver takes over once
# the system has started.
omit_dracutmodules+=" nfs "
omit_drivers+=" amdgpu radeon nouveau i915 xe "
