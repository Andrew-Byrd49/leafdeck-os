# Leafdeck OS: Chromium moves Leafdeck's main process into its own app-leafdeck-<pid>.scope under the user manager's
# app.slice, next to leafdeckd.service and the programs it starts. The session scope's weight (os/leafdeck-session-
# scope.conf) keeps it ahead of them too. Installed by os/setup-fedora.sh to /etc/systemd/user/app-leafdeck-.scope.d/.
[Scope]
CPUWeight=1000
