# Which desktop portal backend answers what in the Leafdeck session (XDG_CURRENT_DESKTOP=Leafdeck). Installed in
# /usr/share/xdg-desktop-portal. Leafdeck's own (os/leafdeck.portal) for the file picker, printing, choosing an app and
# permission questions; the keyring for secrets; GTK's only for what has no window of its own (settings like dark mode).
# Nothing here may open a GTK window: what GTK would ask and Leafdeck doesn't is turned off.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=leafdeck
org.freedesktop.impl.portal.Print=leafdeck
org.freedesktop.impl.portal.AppChooser=leafdeck
org.freedesktop.impl.portal.Access=leafdeck
org.freedesktop.impl.portal.Account=none
org.freedesktop.impl.portal.DynamicLauncher=none
org.freedesktop.impl.portal.Secret=gnome-keyring
